<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 140" width="550" height="140" style="font-family:Arial,sans-serif"><rect width="550" height="140" fill="white"/><rect x="0" y="0" width="550" height="30" fill="#2c3e50"/><text x="15" y="20" fill="white" font-size="13" font-weight="bold">环节</text><text x="115" y="20" fill="white" font-size="13" font-weight="bold">功能</text><text x="250" y="20" fill="white" font-size="13" font-weight="bold">说明</text><line x1="0" y1="30" x2="550" y2="30" stroke="#3498db" stroke-width="2"/><rect x="0" y="30" width="550" height="25" fill="#f0faf0"/><text x="15" y="47" fill="#e74c3c" font-size="14" font-weight="bold">学</text><text x="115" y="47" fill="#2c3e50" font-size="12" font-weight="bold">课程学习</text><text x="250" y="47" fill="#555" font-size="12">课程浏览、课时学习、进度追踪</text><rect x="0" y="55" width="550" height="25" fill="white"/><text x="15" y="72" fill="#3498db" font-size="14" font-weight="bold">练</text><text x="115" y="72" fill="#2c3e50" font-size="12" font-weight="bold">作业练习</text><text x="250" y="72" fill="#555" font-size="12">作业查看、在线提交、批改反馈</text><rect x="0" y="80" width="550" height="25" fill="#f0faf0"/><text x="15" y="97" fill="#27ae60" font-size="14" font-weight="bold">测</text><text x="115" y="97" fill="#2c3e50" font-size="12" font-weight="bold">成绩测评</text><text x="250" y="97" fill="#555" font-size="12">考试成绩、统计图表、趋势分析</text><rect x="0" y="105" width="550" height="25" fill="white"/><text x="15" y="122" fill="#f39c12" font-size="14" font-weight="bold">评</text><text x="115" y="122" fill="#2c3e50" font-size="12" font-weight="bold">综合评估</text><text x="250" y="122" fill="#555" font-size="12">学习统计、排行榜、词汇掌握度</text><line x1="100" y1="0" x2="100" y2="130" stroke="#eee" stroke-width="1"/><line x1="235" y1="0" x2="235" y2="130" stroke="#eee" stroke-width="1"/></svg>