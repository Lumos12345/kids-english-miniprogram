    <text x="10" y="74" class="attr-row">part_of_speech</text>
    <text x="10" y="90" class="attr-row">chinese_meaning</text>
    <text x="10" y="106" class="attr-row">english_definition</text>
    <text x="10" y="122" class="attr-row">example_sentence</text>
    <text x="10" y="138" class="attr-row">audio_url / image_url</text>
    <text x="10" y="154" class="attr-row">difficulty_level / category</text>
    <text x="10" y="170" class="attr-row">frequency</text>
  </g>

  <!-- ===== USER VOCABULARY ===== -->
  <g transform="translate(50,990)">
    <rect class="entity" width="240" height="160"/>
    <rect x="0" y="0" width="240" height="26" fill="#e8daef" stroke="#8e44ad" stroke-width="2" rx="8"/>
    <rect x="0" y="14" width="240" height="12" fill="#e8daef"/>
    <text x="120" y="18" text-anchor="middle" fill="#8e44ad" font-size="14" font-weight="bold">user_vocabulary</text>
    <text x="10" y="42" class="pk">🔑 id (PK)</text>
    <text x="10" y="58" class="fk">🔗 user_id (FK → users)</text>
    <text x="10" y="74" class="fk">🔗 vocab_id (FK → vocabulary)</text>
    <text x="10" y="90" class="attr-row">mastery_level (0-5)</text>
    <text x="10" y="106" class="attr-row">review_count</text>
    <text x="10" y="122" class="attr-row">last_review_date</text>
    <text x="10" y="138" class="attr-row">next_review_date</text>
    <text x="10" y="154" class="fk">🔒 UNIQUE(user_id, vocab_id)</text>
  </g>

  <!-- user N:M vocab via user_vocabulary -->
  <line x1="160" y1="940" x2="160" y2="990" class="rel-line"/>
  <text x="138" y="960" class="rel-many">N</text>
  <text x="185" y="920" class="rel-many">N</text>
  <text x="160" y="980" class="rel-label">learns</text>

  <!-- ===== MESSAGES ===== -->
  <g transform="translate(380,990)">
    <rect class="entity" width="210" height="150"/>
    <rect x="0" y="0" width="210" height="26" fill="#3498db" rx="8"/>
    <rect x="0" y="14" width="210" height="12" fill="#3498db"/>
    <text x="105" y="18" text-anchor="middle" fill="white" font-size="14" font-weight="bold">messages</text>
    <text x="10" y="42" class="pk">🔑 message_id (PK)</text>
    <text x="10" y="58" class="fk">🔗 user_id (FK → users)</text>
    <text x="10" y="74" class="attr-row">title</text>
    <text x="10" y="90" class="attr-row">content</text>
    <text x="10" y="106" class="attr-row">message_type</text>
    <text x="10" y="122" class="attr-row">is_read</text>
    <text x="10" y="138" class="attr-row">created_at</text>
  </g>

  <!-- user 1:N message -->
  <line x1="270" y1="170" x2="420" y2="990" class="rel-line" stroke-dasharray="6,3"/>
  <text x="290" y="550" class="rel-one">1</text>
  <text x="360" y="800" class="rel-many">N</text>

  <!-- Legend -->
  <g transform="translate(750,760)">
    <rect class="label-bg" width="600" height="280"/>
    <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">图例</text>
    
    <rect x="20" y="40" width="20" height="14" fill="#3498db" rx="3"/>
    <text x="50" y="53" font-size="12" fill="#555">主要实体表</text>
    
    <rect x="180" y="40" width="20" height="14" fill="#e8daef" stroke="#8e44ad" stroke-width="1.5" rx="3"/>
    <text x="210" y="53" font-size="12" fill="#555">关联/中间表</text>

    <text x="20" y="80" class="pk">🔑 主键 (PRIMARY KEY)</text>
    <text x="20" y="100" class="fk">🔗 外键 (FOREIGN KEY)</text>
    
    <text x="320" y="80" class="rel-one">1 — 一对一关系</text>
    <text x="320" y="100" class="rel-one">1 — 一对多关系（1 端）</text>
    <text x="320" y="120" class="rel-many">N — 一对多关系（多端）</text>
    
    <line x1="20" y1="155" x2="140" y2="155" class="rel-line"/>
    <text x="160" y="159" font-size="12" fill="#555">实线 → 直接关系</text>
    
    <line x1="20" y1="180" x2="140" y2="180" class="rel-line" stroke-dasharray="6,3"/>
    <text x="160" y="184" font-size="12" fill="#555">虚线 → 间接/逻辑关系</text>

